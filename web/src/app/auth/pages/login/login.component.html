<main class="d-flex flex-column">
  <section class="d-flex flex-column flex-grow-1 align-items-center justify-content-center p-4">
    <p class="mb-4 titulo">CLVPS - Iniciar Sesión</p>
    <div class="bg-white shadow login-box pb-4 pt-5 px-4">
      <form [formGroup]="loginForm" (ngSubmit)="submit()">
        <mat-form-field class="w-100 mt-1" appearance="outline" hideRequiredMarker>
          <mat-icon matPrefix>person</mat-icon>
          <mat-label>Id Usuario</mat-label>
          <input matInput formControlName="userName">
        </mat-form-field>
        <mat-form-field class="w-100 mt-1" appearance="outline" hideRequiredMarker>
          <mat-icon matPrefix>key</mat-icon>
          <mat-label>Contraseña</mat-label>
          <input matInput [type]="showPassword() ?'text'  : 'password'" formControlName="password" />
          <button type="button" mat-icon-button matSuffix (click)="handleShowPassword($event)">
            <mat-icon class="pass-icono">{{showPassword() ?'visibility': 'visibility_off'}}</mat-icon>
          </button>
        </mat-form-field>
        <button type="submit" mat-fab extended [disabled]="!loginForm.valid" class="shadow-none w-100 mt-1">
          {{ 'Ingresar' }}
          <mat-icon>login</mat-icon>
        </button>
      </form>
    </div>

    <div class="alert alert-danger mt-4" role="alert" *ngIf="error">
      {{error}}
    </div>
  </section>
</main>
