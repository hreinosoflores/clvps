<div class="d-flex">
  <div class="bg-light border sidebar">
    <h3 class="fw-bold my-3">
      <a routerLink="/" class="text-decoration-none text-dark">CLVPS</a>
    </h3>
    <p class="my-1">
      {{ usuarioActual()?.nombreCompleto!}}
    </p>
    <mat-divider class="my-4"></mat-divider>
    <ul class="nav d-flex flex-column">
      <li class="nav-item">
        <a class="nav-link text-dark px-0 py-3" routerLink="/profile/mis-datos">Mis Datos</a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-dark px-0 py-3" routerLink="/profile/mis-transacciones">Mis Transacciones</a>
      </li>
      <li class="nav-item" *ngIf="usuarioActual()?.rol! == 'Buyer'">
        <a class="nav-link text-dark px-0 py-3" routerLink="/profile/mis-ordenes-de-pago">Mis Órdenes de Pago</a>
      </li>
      <li class="nav-item" *ngIf="usuarioActual()?.rol! == 'Seller'">
        <a class="nav-link text-dark px-0 py-3" routerLink="/profile/mis-solicitudes-de-retiro">Mis Solicitudes de
          Retiro</a>
      </li>
    </ul>
  </div>
  <div class="d-flex flex-column flex-grow-1 vh-100 overflow-auto">
    <router-outlet></router-outlet>
  </div>
</div>
