<div class="side-content">
  <div class="d-flex flex-row align-items-center justify-content-start">
    <app-avatar class="me-4"></app-avatar>
    <span>{{ usuarioActual()?.nombreCompleto!}}</span>
  </div>
  <mat-divider class="mt-4"></mat-divider>
  <div class="d-flex flex-column mt-2">
    <mat-list role="list">
      <mat-list-item role="listitem" (click)="goToPerfil()">
        <mat-icon matListItemIcon>person</mat-icon>
        <div matListItemTitle>Mi Perfil</div>
      </mat-list-item>
      <mat-list-item role="listitem" (click)="logout()">
        <mat-icon matListItemIcon>logout</mat-icon>
        <div matListItemTitle>Cerrar Sesión</div>
      </mat-list-item>
    </mat-list>
  </div>
</div>
